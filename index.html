  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b120e;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

      border-radius: 22px;

      width: 190px;
      height: 190px;
      object-fit: cover;
      border-radius: 28px;
      display: block;
      margin: 0 auto;
    }

    h1 {
      margin: 22px 0 6px;
      font-size: 23px;
      font-weight: 900;
    }

    .subtitle {
      margin: 0;
      color: #9fa9a2;
      font-size: 13px;
      line-height: 1.45;
    }

    .open {
      display: block;
      width: 100%;
      margin-top: 26px;
      padding: 16px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, #f8a21b, #f39a18);
      color: #111;
      text-decoration: none;
      font-size: 15px;
      font-weight: 900;
    }

    .footer {
      margin-top: 18px;
      color: #69746d;
      font-size: 10px;
      letter-spacing: .6px;
    }
