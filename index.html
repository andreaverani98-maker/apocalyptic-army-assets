<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b120e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apocalyptic Army">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-192.png">

  <title>Apocalyptic Army</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b120e;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        24px
        calc(24px + env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 190px;
      height: 190px;
      max-width: 58vw;
      max-height: 58vw;
      object-fit: contain;
      display: block;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: .4px;
    }

    .subtitle {
      margin: 8px 0 30px;
      color: #a9b5ad;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.1px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      border-radius: 16px;
      background: #1fbe67;
      color: #07100a;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .4px;
      box-shadow: 0 10px 28px rgba(31,190,103,.18);
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(.985);
    }

    .footer {
      margin-top: 28px;
      color: #617068;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="app">
    <img class="logo" src="logo.png" alt="Apocalyptic Army A.S.D.">

    <h1>APOCALYPTIC ARMY</h1>
    <div class="subtitle">A.S.D. · SOFTAIR BITONTO</div>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbxIVNIhmeJzQP98glFEjO5diEaY-knjvHDkrUQCPxTGvCziqsXEZ-2vcKmR9iSZZ1ap/exec"
    >
      APRI GESTIONALE
    </a>

    <div class="footer">GESTIONALE ASSOCIATIVO</div>
  </main>
</body>
</html>
