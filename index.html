<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b120e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apocalyptic Army">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-192.png">
  <title>Cassa Apocalyptic Army</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b120e;
    }
    body { font-family: Arial, Helvetica, sans-serif; }
    .shell {
      position: fixed;
      inset: 0;
      background: #0b120e;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0b120e;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0b120e;
      color: white;
      z-index: 2;
      transition: opacity .25s ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 24px;
    }
    .title {
      font-size: 18px;
      font-weight: 900;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: #f39a18;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="shell">
    <div id="loading" class="loading">
      <img class="logo" src="logo-512.png" alt="Apocalyptic Army ASD">
      <div class="title">Cassa Apocalyptic Army</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <iframe
      id="gestionale"
      title="Gestionale Apocalyptic Army"
      src="https://script.google.com/macros/s/AKfycbxIVNIhmeJzQP98glFEjO5diEaY-knjvHDkrUQCPxTGvCziqsXEZ-2vcKmR9iSZZ1ap/exec"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <script>
    const frame = document.getElementById('gestionale');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', function () {
      setTimeout(function () {
        loading.classList.add('hidden');
      }, 250);
    });
  </script>
</body>
</html>
